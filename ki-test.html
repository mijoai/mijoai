<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mijo AI – KI live testen</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FAF7F1;--stone-line:#E1D8C4;--ink:#182338;--ink-soft:#4A5468;--navy-deep:#132840;--gold:#C89B3C;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--ink);font-family:'Inter',sans-serif;padding:16px}
  .card{max-width:440px;width:100%;background:#fff;border:1px solid var(--stone-line);border-radius:20px;padding:32px 28px;text-align:center;box-shadow:0 10px 40px rgba(19,40,64,.08)}
  h1{font-family:'Fraunces',serif;font-size:28px;margin:0 0 8px}
  p{color:var(--ink-soft);margin:0 0 22px;line-height:1.5}
  .orb{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 35% 30%,#e9d8af,var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:36px;color:var(--navy-deep);transition:transform .2s}
  .orb.live{animation:pulse 1.6s ease-in-out infinite}
  .orb.talk{animation:pulse .7s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(200,155,60,.45)}50%{transform:scale(1.07);box-shadow:0 0 0 18px rgba(200,155,60,0)}}
  button{border:none;cursor:pointer;background:var(--gold);color:var(--navy-deep);font:700 15px 'Inter',sans-serif;padding:15px 28px;border-radius:999px;width:100%}
  button:hover{background:#B98C2E}
  button.end{background:#7C3A3A;color:#fff}
  button:disabled{opacity:.6;cursor:wait}
  .status{min-height:22px;margin-top:14px;font-size:14px;color:var(--ink-soft)}
  .hint{margin-top:18px;font-size:12.5px;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="card">
  <div class="orb" id="orb">M</div>
  <h1>Sprechen Sie mit der KI</h1>
  <p>So klingt ein Mijo AI Telefonassistent. Klicken Sie auf Start und sprechen Sie einfach los.</p>
  <button id="btn">Gespräch starten</button>
  <div class="status" id="status"></div>
  <div class="hint">Max. 3 Minuten · Demo, es wird nichts gespeichert · Mikrofon nötig</div>
</div>

<script type="module">
import { RetellWebClient } from "https://cdn.jsdelivr.net/npm/retell-client-js-sdk@3.0.2/+esm";

const API = "https://a4milan.app.n8n.cloud/webhook/mijo-web-call";
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const orb = document.getElementById("orb");
const client = new RetellWebClient();
let active = false;

function setIdle(msg){
  active = false;
  btn.disabled = false; btn.textContent = "Gespräch starten"; btn.className = "";
  orb.className = "orb";
  statusEl.textContent = msg || "";
}

client.on("call_started", () => {
  active = true;
  btn.disabled = false; btn.textContent = "Gespräch beenden"; btn.className = "end";
  orb.className = "orb live";
  statusEl.textContent = "Verbunden. Sie können sprechen.";
});
client.on("call_ended", () => setIdle("Gespräch beendet. Danke fürs Testen!"));
client.on("agent_start_talking", () => { orb.className = "orb talk"; });
client.on("agent_stop_talking", () => { if (active) orb.className = "orb live"; });
client.on("error", (e) => {
  console.error(e);
  try { client.stopCall(); } catch (_) {}
  setIdle("Verbindung fehlgeschlagen. Bitte erneut versuchen.");
});

btn.addEventListener("click", async () => {
  if (active) { client.stopCall(); return; }
  btn.disabled = true; statusEl.textContent = "Verbinde …";
  try {
    // Mikrofon-Erlaubnis zuerst anfragen, damit eine Ablehnung klar gemeldet wird
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    setIdle("Bitte erlauben Sie den Zugriff auf das Mikrofon.");
    return;
  }
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    await client.startCall({
      callId: d.call_id,
      accessToken: d.access_token,
      transport: d.transport,
      iceServers: d.ice_servers
    });
  } catch (e) {
    console.error(e);
    setIdle("Das hat leider nicht geklappt. Bitte später erneut versuchen.");
  }
});
</script>
</body>
</html>
